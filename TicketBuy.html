<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almaty Oceanarium Tickets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e6f7ff;
      color: #00334d;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0099cc;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #0099cc;
      border-radius: 8px;
    }
    button {
      background-color: #0099cc;
      color: white;
      border: none;
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #007399;
    }
    .hidden {
      display: none;
    }
    .receipt-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>Almaty Oceanarium - Ticket Purchase</header>

  <!-- Страница покупки -->
  <main id="purchasePage">
    <form id="ticketForm">
      <label for="child">Child Tickets (2000 KZT each)</label>
      <input type="number" id="child" name="child" min="0" value="0">

      <label for="adult">Adult Tickets (4000 KZT each)</label>
      <input type="number" id="adult" name="adult" min="0" value="0">

      <label for="card">Card Number</label>
      <input type="text" id="card" name="card" placeholder="XXXX XXXX XXXX XXXX" required>

      <label for="cvv">CVV</label>
      <input type="text" id="cvv" name="cvv" placeholder="XXX" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>

      <button type="submit">Submit</button>
    </form>
  </main>

  <!-- Страница чека -->
  <div id="receiptPage" class="hidden">
    <div class="receipt-box" id="receipt"></div>
  </div>

  <script>
    document.getElementById("ticketForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let child = parseInt(document.getElementById("child").value) || 0;
      let adult = parseInt(document.getElementById("adult").value) || 0;
      let total = (child * 2000) + (adult * 4000);

      // Создаем содержимое чека
      let receiptContent = `
        <h2>Receipt</h2>
        <p>Child Tickets: ${child} × 2000 KZT = ${child*2000} KZT</p>
        <p>Adult Tickets: ${adult} × 4000 KZT = ${adult*4000} KZT</p>
        <hr>
        <p><strong>Total: ${total} KZT</strong></p>
        <br>
        <p style="color:#007399;font-weight:bold;">Ticket for one visit is valid for two weeks. Show them QR we sent to your Email</p>
      `;

      document.getElementById("purchasePage").classList.add("hidden");
      document.getElementById("receiptPage").classList.remove("hidden");
      document.getElementById("receipt").innerHTML = receiptContent;
    });
  </script>
</body>
</html>
